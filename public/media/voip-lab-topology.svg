<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="Secure VoIP lab topology: MicroSIP and Zoiper endpoints register to an Asterisk PBX; SIP signaling is protected with TLS on port 5061 and media with SRTP-SDES; Wireshark captures outside the trust boundary see only noise.">
  <rect x="0" y="0" width="920" height="460" fill="#0e1116"/>

  <text x="40" y="40" fill="#edede6" font-size="20" font-weight="700">Secure VoIP Lab: Asterisk + SRTP + TLS</text>

  <!-- Trust boundary -->
  <rect x="20" y="96" width="880" height="252" rx="6" fill="none" stroke="#ff5c38" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="460" y="86" fill="#ff5c38" font-size="12" letter-spacing="1.5" text-anchor="middle">ENCRYPTED PATH // TLS SIGNALING + SRTP-SDES MEDIA</text>

  <!-- OpenSSL cert -->
  <rect x="388" y="112" width="144" height="44" rx="4" fill="#161b22" stroke="#c9a227" stroke-width="1.5"/>
  <text x="460" y="132" fill="#c9a227" font-size="12" text-anchor="middle">OpenSSL</text>
  <text x="460" y="147" fill="#8a94a6" font-size="11" text-anchor="middle">self-signed cert</text>
  <line x1="460" y1="156" x2="460" y2="176" stroke="#c9a227" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- MicroSIP -->
  <rect x="40" y="186" width="200" height="84" rx="6" fill="#161b22" stroke="#2a3342" stroke-width="1.5"/>
  <text x="140" y="218" fill="#edede6" font-size="15" text-anchor="middle">MicroSIP</text>
  <text x="140" y="238" fill="#8a94a6" font-size="12" text-anchor="middle">ext 6001 (Windows)</text>

  <!-- Asterisk -->
  <rect x="360" y="178" width="200" height="100" rx="6" fill="#161b22" stroke="#ff5c38" stroke-width="2"/>
  <text x="460" y="214" fill="#edede6" font-size="15" text-anchor="middle">Asterisk 22 / PJSIP</text>
  <text x="460" y="234" fill="#8a94a6" font-size="12" text-anchor="middle">PBX (Ubuntu Server)</text>
  <text x="460" y="252" fill="#3ecf8e" font-size="11" text-anchor="middle">TLS 5061 + SRTP-SDES</text>

  <!-- Zoiper -->
  <rect x="680" y="186" width="200" height="84" rx="6" fill="#161b22" stroke="#2a3342" stroke-width="1.5"/>
  <text x="780" y="218" fill="#edede6" font-size="15" text-anchor="middle">Zoiper</text>
  <text x="780" y="238" fill="#8a94a6" font-size="12" text-anchor="middle">ext 6002 (Android)</text>

  <!-- Links -->
  <line x1="240" y1="228" x2="360" y2="228" stroke="#edede6" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="300" y="212" fill="#c9a227" font-size="11" text-anchor="middle">SIP / TLS 5061</text>
  <text x="300" y="250" fill="#3ecf8e" font-size="11" text-anchor="middle">SRTP media</text>

  <line x1="560" y1="228" x2="680" y2="228" stroke="#edede6" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="620" y="212" fill="#c9a227" font-size="11" text-anchor="middle">SIP / TLS 5061</text>
  <text x="620" y="250" fill="#3ecf8e" font-size="11" text-anchor="middle">SRTP media</text>

  <!-- Wireshark (outside boundary) -->
  <line x1="460" y1="278" x2="460" y2="384" stroke="#7a8497" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="388" y="384" width="144" height="52" rx="4" fill="#161b22" stroke="#2a3342" stroke-width="1.5"/>
  <text x="460" y="406" fill="#edede6" font-size="13" text-anchor="middle">Wireshark</text>
  <text x="460" y="423" fill="#8a94a6" font-size="11" text-anchor="middle">packet capture</text>
  <text x="560" y="415" fill="#3ecf8e" font-size="11">SRTP: playback = noise</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#edede6"/>
    </marker>
  </defs>
</svg>
